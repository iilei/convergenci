[tools]
gomplate = "latest"

[tasks.fmt]
description = "Format Go sources"
run = "gofmt -w ."

[tasks.vet]
description = "Run Go vet"
run = "go vet ./..."

[tasks.test]
depends = ["build-fake-aws"]
description = "Run Go tests"
run = "go test ./..."

[tasks.check]
depends = ["build-fake-aws"]
description = "Format, vet, and test the Go project"
run = "gofmt -w . && go vet ./... && go test ./..."

[tasks.build]
description = "Build the convergenci binary"
run = "go build -o ./convergenci ./cmd/convergenci"

[tasks.build-fake-aws]
description = "Build the fake AWS CLI binary for local bench testing"
run = "mkdir -p ./testdata/fake-aws-bin && go build -o ./testdata/fake-aws-bin/aws ./testdata/fake-aws"

# export CONVERGENCI_DEBUG_FORMAT='[{{ .Level }} {{ .Timestamp }}] status={{ .Status }} pct={{ .PercentageComplete }}'
# export DEBUG=true;
[tasks.fake-aws-scenarios-scan]
depends = ["build", "build-fake-aws"]
description = "Exercise all built-in fake AWS scenarios against the await flow"
run = """
for scenario in asg-custom-tag-rotation asg-nested-module-complex-name ; do
    out_dir=\".bench/$scenario\"; rm -rf "$out_dir"; mkdir -p \"$out_dir\";
    ./convergenci scan stubs/$scenario.json  \
    --output-json "${out_dir}/.convergence.json" \
    --aws-cli-path "$PWD/testdata/fake-aws-bin/aws"
done
"""

[tasks.fake-aws-scenarios-assert-all-settled]
depends = ["build", "build-fake-aws"]
description = "Exercise the assert-all-settled preflight guard against success and in-progress scenarios"
run = """
for scenario in success in-progress; do
    log="/tmp/convergenci-assert-all-settled-$scenario.log"
    FAKE_AWS_SCENARIO="$scenario" \
    ./convergenci scan stubs/asg-default-rotation.json \
    --assert-all-settled \
    --aws-cli-path "$PWD/testdata/fake-aws-bin/aws" \
    >"$log" 2>&1 || true
    echo "scenario=$scenario"
    cat "$log"
    echo '---'
done
"""

[tasks.fake-aws-scenarios-await]
depends = ["fake-aws-scenarios-scan"]
description = "Exercise all built-in fake AWS scenarios against the await flow"
run = """
for scenario in asg-custom-tag-rotation asg-nested-module-complex-name ; do
    out_dir=\".bench/$scenario\";
    CONVERGENCI_AWAIT_TIMEOUT=50ms CONVERGENCI_AWAIT_INTERVAL=5ms FAKE_AWS_SCENARIO=in-progress-then-success \
    ./convergenci await "${out_dir}/.convergence.json" \
    --aws-cli-path "$PWD/testdata/fake-aws-bin/aws"
done
"""

[tasks.fake-aws-scenarios-await-slow]
depends = ["build", "build-fake-aws"]
description = "Render await reports with real polling delays"
run = """
out_dir=".bench/slow-asg-default-rotation"; rm -rf "$out_dir"; mkdir -p "$out_dir";
./convergenci scan stubs/asg-default-rotation.json \
--output-json "${out_dir}/.convergence.json" \
--aws-cli-path "$PWD/testdata/fake-aws-bin/aws"

rm -f /tmp/convergenci-fake-aws-state-in_progress_then_success
CONVERGENCI_AWAIT_TIMEOUT=2s CONVERGENCI_AWAIT_INTERVAL=750ms FAKE_AWS_DELAY=750ms FAKE_AWS_SCENARIO=in-progress-then-success \
./convergenci await "${out_dir}/.convergence.json" \
--aws-cli-path "$PWD/testdata/fake-aws-bin/aws"
./convergenci report "${out_dir}/.convergence.convergence-report.json"
"""

[tasks.fake-aws-scenarios-terragrunt]
depends = ["build", "build-fake-aws"]
description = "Exercise nested Terragrunt-style stacks through scan, assert, await, and report"
run = """
out_dir=".bench/terragrunt-multi-stack"; rm -rf "$out_dir"; mkdir -p "$out_dir";
./convergenci scan stubs/terragrunt-multi-stack.json \
--output-json "${out_dir}/.convergence.json" \
--aws-cli-path "$PWD/testdata/fake-aws-bin/aws"

for scenario in success in-progress; do
    log="/tmp/convergenci-terragrunt-$scenario.log"
    if FAKE_AWS_SCENARIO="$scenario" ./convergenci scan stubs/terragrunt-multi-stack.json \
        --assert-all-settled --aws-cli-path "$PWD/testdata/fake-aws-bin/aws" >"$log" 2>&1; then
        if [ "$scenario" = "in-progress" ]; then
            echo "scenario=$scenario unexpectedly succeeded"; cat "$log"; exit 1
        fi
    elif [ "$scenario" = "success" ]; then
        echo "scenario=$scenario unexpectedly failed"; cat "$log"; exit 1
    fi
    echo "scenario=$scenario"; cat "$log"; echo '---'
done

CONVERGENCI_AWAIT_TIMEOUT=3s CONVERGENCI_AWAIT_INTERVAL=100ms FAKE_AWS_DELAY=650ms FAKE_AWS_SCENARIO=success \
./convergenci await "${out_dir}/.convergence.json" \
--aws-cli-path "$PWD/testdata/fake-aws-bin/aws"
./convergenci report "${out_dir}/.convergence.convergence-report.json"
"""

[tasks.render-report]
description = "Render the generated fake AWS reports with the built-in report renderer"
depends = [ "fake-aws-scenarios-await"]
run = """ \
for scenario in asg-custom-tag-rotation asg-nested-module-complex-name ; do
    out_dir=\".bench/$scenario\";
    ./convergenci report "${out_dir}/.convergence.convergence-report.json" && echo '
+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
'
done
"""
