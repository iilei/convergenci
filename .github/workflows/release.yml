name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: Run tests
        run: go test ./...

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Release via goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Sign release artifacts
        run: |
          cd dist
          set -euo pipefail
          shopt -s nullglob
          for artifact in *.tar.gz *.zip checksums.txt; do
            gpg --batch --yes --detach-sign --local-user "${{ steps.import_gpg.outputs.fingerprint }}" "$artifact"
          done
        shell: bash

      - name: Upload GPG signatures
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*.sig

      - name: Publish SHA256 sidecars
        run: |
          cd dist
          for file in *.tar.gz *.zip; do
            sha256sum "$file" | awk '{print $1}' > "$file.sha256"
          done
        shell: bash

      - name: Upload SHA256 sidecars to release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*.sha256

  notify-homebrew-tap:
    name: Notify homebrew-tap
    runs-on: ubuntu-latest
    needs:
      - release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Notify homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${VERSION#v}"
          REPOSITORY="${GITHUB_REPOSITORY#*/}"

          fetch_sha() {
            local name="$1"
            local attempts="${SHA_RETRY_ATTEMPTS:-5}"
            local delay_seconds="${SHA_RETRY_DELAY_SECONDS:-8}"
            local i=1
            local sha=""
            local url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${name}.sha256"

            while [[ "$i" -le "$attempts" ]]; do
              sha="$(curl -fsSL "$url" 2>/dev/null \
                | tr -d '\r' \
                | awk 'NR==1 {print $1}' || true)"

              if [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]]; then
                printf '%s\n' "$sha"
                return 0
              fi

              echo "Attempt ${i}/${attempts} failed for ${name}; retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              i=$((i + 1))
            done

            echo "Failed to resolve valid SHA256 from sidecar after ${attempts} attempts: ${name}"
            return 1
          }

          SHA_MACOS_UNIVERSAL2="$(fetch_sha "convergenci_${VERSION}_darwin_universal2.tar.gz")"
          SHA_LINUX_X86_64="$(fetch_sha "convergenci_${VERSION}_linux_x86_64.tar.gz")"
          SHA_LINUX_ARM64="$(fetch_sha "convergenci_${VERSION}_linux_arm64.tar.gz")"
          SHA256_LINUX_ARMV7="$(fetch_sha "convergenci_${VERSION}_linux_armv7.tar.gz")"
          payload="$(jq -n \
            --arg version "$VERSION" \
            --arg sha_macos_universal2 "$SHA_MACOS_UNIVERSAL2" \
            --arg sha256_linux_x86_64 "$SHA_LINUX_X86_64" \
            --arg sha_linux_arm64 "$SHA_LINUX_ARM64" \
            --arg sha_linux_armv7 "$SHA256_LINUX_ARMV7" \
            --arg repository "$REPOSITORY" \
            '{
              event_type: "formula-update",
              client_payload: {
                repository: $repository,
                version: $version,
                sha256_macos_universal2: $sha_macos_universal2,
                sha256_linux_x86_64: $sha256_linux_x86_64,
                sha256_linux_arm64: $sha_linux_arm64,
                sha256_linux_armv7: $sha_linux_armv7,
              }
            }')"

          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/iilei/homebrew-tap/dispatches \
            -d "$payload"
