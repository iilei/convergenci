name: Coverage

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: Run coverage
        run: |
          mkdir -p coverage
          mkdir -p ./testdata/fake-aws-bin && go build -o ./testdata/fake-aws-bin/aws ./testdata/fake-aws
          CONVERGENCI_AWAIT_TIMEOUT=250ms CONVERGENCI_AWAIT_INTERVAL=50ms go test -coverprofile=coverage/coverage.out ./...
          go tool cover -func=coverage/coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.out
          fail_ci_if_error: true
